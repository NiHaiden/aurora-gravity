name: Latest Images
on:
  push:
    branches:
      - gravity
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - gravity
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "30 4 * * *" # daily, picks up new Gravity kernels/Mesa and Fedora updates
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build-image-latest:
    name: Build Latest Images
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
    with:
      brand_name: aurora-gravity
      image_flavors: '["main"]'
      stream_name: latest
      architecture: '["aarch64"]'
      publish: ${{ github.event_name != 'pull_request' }}
