name: Stable Images
on:
  schedule:
    - cron: "0 3 * * TUE" # weekly, like upstream Aurora :stable
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build-image-stable:
    name: Build Stable Images
    uses: ./.github/workflows/reusable-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
    with:
      brand_name: aurora-gravity
      image_flavors: '["main"]'
      stream_name: stable
      architecture: '["aarch64"]'
      publish: ${{ github.event_name != 'pull_request' }}
